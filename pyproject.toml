[tool.poetry]
name = "machinemoo"
version = "0.1.0"
description = "Multi-objective optimization library for Machine Learning"
authors = ["Aline Cavalca Carvalho Soares de Azevedo <a189593@dac.unicamp.br>"]
readme = "README.md"
packages = [{ include = "machinemoo"}]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.2.6"
pandas = "^2.2.3"
pyomo = "^6.9.2"
matplotlib = "^3.10.3"
scikit-learn = "^1.6.1"
pymoo = "^0.6.1.3"
gurobipy = "^12.0.2"
ipykernel = "^6.29.5"
torch = "^2.7.0"
transformers = "^4.51.3"
pulp = "^3.1.1"
plotly = "^6.1.0"
seaborn = "^0.13.2"
datasets = "^3.6.0"
mip = "^1.14.2"
nbformat = "^5.10.4"
pymcdm = "^1.3.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.15"
mkdocstrings-python = "^1.16.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true